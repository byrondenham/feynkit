integralfamilies:
  - name: "doublebox"
    loop_momenta: [l1, l2]
    top_level_sectors: [127]
    propagators:
      - ["l1+p1", 0]
      - ["l1+p1+p2", 0]
      - ["l1", 0]
      - ["l1+l2", 0]
      - ["l2-p1-p2", 0]
      - ["l2", 0]
      - ["l2-p1-p2-p3", 0]
      - ["l1+p1+p3", 0]
      - ["l2-p1-p3", 0]
