status = "disputed"
source = "KK17"
location = "Sec. 6, arXiv PDF p. 19"
verified = "text"
checked = "2026-10-09"
note = "Two published counts for the same integral. 2: the number of independent critical points of the Lee-Pomeransky polynomial by the criteria of the paper's Ref. [45] (q4 and q6). 1: one non-trivial master integral by differential reduction (Refs. [43, 49]), the second being a product of Gamma functions. The paper explains the difference by the treatment of propagator powers and dimension, and a footnote quotes a comment that the algebraic relation behind the second count does not follow from IBP relations, so the results do not contradict each other."

