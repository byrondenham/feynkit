name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, SymPy ground types ${{ matrix.ground-types }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # python-flint, a development dependency, makes SymPy use FLINT integers;
          # one job keeps SymPy's pure-Python integers, as without the backends extra.
          - python-version: "3.10"
            ground-types: python
          - python-version: "3.14"
            ground-types: flint
    env:
      SYMPY_GROUND_TYPES: ${{ matrix.ground-types }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install 4ti2 (toric ideal backend), Singular (elimination backend) and TeX Live (report compile test)
        run: >-
          sudo apt-get update && sudo apt-get install -y 4ti2 singular
          texlive-latex-base texlive-latex-recommended texlive-pictures
          texlive-fonts-recommended lmodern
      - run: uv sync --locked
      - run: uv run pytest --no-cov -q

  lint:
    name: pre-commit (black, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
