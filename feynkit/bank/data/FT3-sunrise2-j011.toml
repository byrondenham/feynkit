[family]
id = "FT3-sunrise2-j011"
area = "formal"
kind = "graph"
status = "H"
title = "The on-shell two-loop sunrise J011 with one massless line"
tags = ["sunrise", "on-shell", "disputed"]
cnickel = "111e|e|:nnn"
loops = 2
propagators = 3

# M_3 = 0 and M_1^2 = M_2^2 = p^2 = 1. The variable s is the square of the external momentum.
[[point]]
name = "j011"
values = { "s" = "1", "m_1^2" = "1", "m_2^2" = "1", "m_3^2" = "0" }

# The same masses at a generic external momentum, for comparison.
[[point]]
name = "j011-generic-momentum"
values = { "s" = "7/3", "m_1^2" = "1", "m_2^2" = "1", "m_3^2" = "0" }

